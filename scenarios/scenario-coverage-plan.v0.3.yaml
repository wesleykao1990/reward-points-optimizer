version: 0.3.0
research_cutoff: '2026-08-17'
purpose: Coverage-balanced research queue for 100 evidence-backed scenarios. The 100-fixture program is a continuous quality
  track, not a gate for a narrow alpha.
distribution:
  total: 100
  by_level:
    L1_SINGLE_RULE: 40
    L2_STACKING: 40
    L3_ADVERSARIAL: 20
  by_category:
    CVS: 15
    DRG: 10
    SUP: 10
    FNB: 10
    ELE: 8
    ECOM: 12
    RET: 5
    TRV: 5
    QR: 8
    CMP: 10
    XFR: 7
status_meaning:
  planned: Research has not yet produced a verified expected result.
  candidate: Evidence and a draft calculation exist.
  golden: Approved under a recorded review mode. Solo dual-pass is not represented as independent human review.
scenarios:
- scenario_id: JP-CMP-001
  category: CMP
  title: Campaign entry required before purchase
  target: Generic Japanese campaign
  level: L1_SINGLE_RULE
  behavior_under_test: Enrollment condition
  primary_source_ids:
  - jp.paypay.campaigns
  - jp.dbarai.campaigns
  required_negative_assertion: No entry means no campaign reward.
  status: planned
  golden_gate:
  - Capture immutable evidence from every primary source using an approved or manual method.
  - Calculate every candidate plan independently before viewing engine output.
  - Record operation-level ledgers, asset balance deltas, winner or conditional winners, rejected alternatives, and negative
    assertions.
  - Complete an allowed review mode; solo work must use dual-pass calculation and a cooling-off reread.
  contract_features:
  - campaign_validity_or_cap
  release_track: alpha_support
  required_domain_features:
  - direct_purchase

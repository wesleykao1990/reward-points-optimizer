name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jro_ci
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install TypeScript workspace dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify pinned Agent Feed schema artifact bytes
        run: python scripts/verify_agent_feed_artifact.py

      - name: Test Agent Feed artifact verifier
        run: python -m unittest tests/test_verify_agent_feed_artifact.py

      - name: Validate foundation contracts
        run: python3 scripts/validate_package.py

      - name: Verify generated M3 database seed
        run: pnpm seed:m3:check

      - name: Verify Supabase production migration staging
        run: pnpm deploy:supabase:check

      - name: Verify M3 publication checkpoint
        run: |
          pnpm publication:m3:check
          pnpm publication:m3:self-test

      - name: Lint TypeScript workspace
        run: pnpm lint

      - name: Typecheck TypeScript workspace
        run: pnpm typecheck

      - name: Validate schema, registry, and examples
        run: |
          pnpm validate:schemas
          pnpm validate:registry
          pnpm validate:examples

      - name: Test deterministic engine and properties
        run: |
          pnpm test
          pnpm test:property

      - name: Build TypeScript workspace
        run: pnpm build

      - name: Test PostgreSQL migrations and security gates
        env:
          JRO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jro_ci
          JRO_DB_TEST_CONFIRM: isolated
        run: pnpm test:db

      - name: Build conserved kernel prototype
        working-directory: prototype
        run: npm run build

      - name: Test accounting and trust invariants
        working-directory: prototype
        run: npm test

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify package integrity
        run: python scripts/generate_checksums.py --check

      - name: Validate foundation contracts
        run: python scripts/validate_package.py

      - name: Build conserved kernel prototype
        working-directory: prototype
        run: npm run build

      - name: Test accounting and trust invariants
        working-directory: prototype
        run: npm test

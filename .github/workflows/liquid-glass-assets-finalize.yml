name: Finalize Liquid Glass asset catalogue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/liquid-glass-assets-finalize.yml

permissions:
  contents: write

concurrency:
  group: liquid-glass-assets-completion
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated browser acquisition runtime
        run: |
          mkdir -p /tmp/liquid-glass-puppeteer
          printf '{"type":"module"}\n' > /tmp/liquid-glass-puppeteer/package.json
          npm install --prefix /tmp/liquid-glass-puppeteer --no-save --package-lock=false puppeteer@24.16.0
          echo "PUPPETEER_ENTRY=/tmp/liquid-glass-puppeteer/node_modules/puppeteer/lib/esm/puppeteer/puppeteer.js" >> "$GITHUB_ENV"

      - name: Add official product-page capture and embedded-artwork rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/complete_liquid_glass_assets.mjs")
          text = path.read_text()

          if "async function officialPageCapture" not in text:
              marker = "async function acquireRemote(asset, pageUrl, explicitImageUrl) {"
              insertion = r'''
          async function officialPageCapture(asset, pageUrl) {
            try {
              puppeteerPromise ??= import(
                pathToFileURL(process.env.PUPPETEER_ENTRY).href,
              );
              const puppeteer = await puppeteerPromise;
              browserPromise ??= puppeteer.default.launch({
                headless: true,
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                ],
              });
              const browser = await browserPromise;
              const page = await browser.newPage();
              try {
                await page.setUserAgent(USER_AGENT);
                await page.setViewport({
                  width: 1586,
                  height: 1000,
                  deviceScaleFactor: 1,
                });
                await page.goto(pageUrl, {
                  waitUntil: "domcontentloaded",
                  timeout: 45_000,
                });
                await new Promise((resolve) => setTimeout(resolve, 1400));
                const bytes = Buffer.from(
                  await page.screenshot({
                    type: "png",
                    clip: { x: 0, y: 0, width: 1586, height: 1000 },
                  }),
                );
                return {
                  bytes,
                  imageUrl: `${pageUrl}#official-product-page-capture`,
                  mime: "image/png",
                  dimensions: { width: 1586, height: 1000 },
                  descriptor: "official-product-page-capture",
                  score: 200,
                  pageUrl,
                  sourceKind: "official_product_page_capture",
                };
              } finally {
                await page.close();
              }
            } catch {
              return null;
            }
          }

          '''
              text = text.replace(marker, insertion + marker)

          needle = r'''          if (isCreditCard(asset)) {
            const renderedElement = await officialElementScreenshot(asset, pageUrl);
            if (renderedElement) return renderedElement;
          }

          if (!isCreditCard(asset)) {
          '''
          replacement = r'''          if (isCreditCard(asset)) {
            const renderedElement = await officialElementScreenshot(asset, pageUrl);
            if (renderedElement) return renderedElement;
            const pageCapture = await officialPageCapture(asset, pageUrl);
            if (pageCapture) return pageCapture;
          }

          if (!isCreditCard(asset)) {
          '''
          text = text.replace(needle, replacement)

          text = text.replace(
              '  const inner = sourceFile\n    ? `<image',
              '  const artworkHref = source.bytes && source.bytes.length <= 1500000\n    ? `data:${source.mime};base64,${source.bytes.toString("base64")}`\n    : sourceFile?.publicPath;\n  const inner = artworkHref\n    ? `<image',
          )
          text = text.replace(
              '        sourceFile.publicPath,\n      )}',
              '        artworkHref,\n      )}',
          )

          if "async function renderedArtworkMetrics" not in text:
              smoke_marker = "async function waitForProductionManifest(generationRunId) {"
              smoke_helper = r'''
          async function renderedArtworkMetrics(assetPath) {
            try {
              puppeteerPromise ??= import(
                pathToFileURL(process.env.PUPPETEER_ENTRY).href,
              );
              const puppeteer = await puppeteerPromise;
              browserPromise ??= puppeteer.default.launch({
                headless: true,
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                ],
              });
              const browser = await browserPromise;
              const page = await browser.newPage();
              try {
                await page.goto(PRODUCTION_ORIGIN, {
                  waitUntil: "domcontentloaded",
                  timeout: 30_000,
                });
                return await page.evaluate(async (source) => {
                  const image = new Image();
                  image.src = `${source}?render=${Date.now()}`;
                  await new Promise((resolve, reject) => {
                    image.onload = resolve;
                    image.onerror = reject;
                  });
                  const canvas = document.createElement("canvas");
                  canvas.width = 428;
                  canvas.height = 270;
                  const context = canvas.getContext("2d", {
                    willReadFrequently: true,
                  });
                  context.drawImage(image, 0, 0, canvas.width, canvas.height);
                  const pixels = context.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height,
                  ).data;
                  let opaque = 0;
                  let colorful = 0;
                  for (let index = 0; index < pixels.length; index += 4) {
                    const red = pixels[index];
                    const green = pixels[index + 1];
                    const blue = pixels[index + 2];
                    const alpha = pixels[index + 3];
                    if (alpha > 20) opaque += 1;
                    if (
                      alpha > 20 &&
                      Math.max(red, green, blue) - Math.min(red, green, blue) > 28
                    )
                      colorful += 1;
                  }
                  return { opaque, colorful };
                }, `${PRODUCTION_ORIGIN}${assetPath}`);
              } finally {
                await page.close();
              }
            } catch {
              return { opaque: 0, colorful: 0 };
            }
          }

          '''
              text = text.replace(smoke_marker, smoke_helper + smoke_marker)

          smoke_needle = (
              '          if (!svg.includes(\'viewBox="0 0 856 539.8"\'))\n'
              '            throw new Error(`production_ratio_invalid:${id}`);\n'
              '        }\n'
          )
          smoke_replacement = (
              '          if (!svg.includes(\'viewBox="0 0 856 539.8"\'))\n'
              '            throw new Error(`production_ratio_invalid:${id}`);\n'
              '          const metrics = await renderedArtworkMetrics(asset.path);\n'
              '          if (metrics.opaque < 60000 || metrics.colorful < 1200)\n'
              '            throw new Error(\n'
              '              `production_artwork_not_rendered:${id}:${JSON.stringify(metrics)}`,\n'
              '            );\n'
              '        }\n'
          )
          text = text.replace(smoke_needle, smoke_replacement)

          path.write_text(text)
          PY

      - name: Complete generation, deployment, and rendered-artwork smoke test
        env:
          LIQUID_GLASS_PRODUCTION_ORIGIN: https://reward-points-optimizer-consumer-al.vercel.app
        run: node scripts/complete_liquid_glass_assets.mjs

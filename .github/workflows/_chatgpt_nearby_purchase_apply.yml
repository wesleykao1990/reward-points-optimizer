.controls h2 { margin: 0 0 6px; font-size: 18px; }
.controls p { margin: 0; color: #666; line-height: 1.6; font-size: 14px; }
.wallet-summary { margin-top: 8px !important; font-weight: 700; color: #333 !important; }
.search-actions { display: flex; gap: 12px; align-items: end; }
.amount-field { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: #555; }
.amount-input { display: flex; align-items: center; gap: 4px; min-width: 130px; padding: 10px 12px; border: 1px solid #d8d5cd; border-radius: 12px; background: #faf9f6; }
.amount-input input { width: 92px; border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 700; outline: none; }
button { appearance: none; border: 0; border-radius: 999px; background: #151515; color: #fff; padding: 14px 22px; font-weight: 700; white-space: nowrap; cursor: pointer; }
button:disabled { opacity: .45; cursor: wait; }
.disclosure { margin: 12px 2px 0; color: #777; font-size: 12px; line-height: 1.6; }
.status { min-height: 26px; margin: 20px 2px; font-size: 14px; color: #555; }
.status[data-kind="error"] { color: #9a2c24; }
.status[data-kind="success"] { color: #24643a; }
.results { display: grid; gap: 14px; }
.merchant-card { background: #fff; border: 1px solid #dedbd3; border-radius: 18px; padding: 22px; }
.merchant-heading { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.merchant-brand { margin: 0 0 5px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: #777; }
.merchant-card h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.distance { background: #f0eee8; border-radius: 999px; padding: 7px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.address { margin: 10px 0 18px; color: #666; font-size: 14px; }
.advice-panel { display: grid; gap: 12px; border: 1px solid #d5e0d5; background: #f7faf6; border-radius: 14px; padding: 16px; }
.advice-kicker { margin: 0; font-size: 11px; letter-spacing: .12em; font-weight: 800; color: #486048; }
.best-payment { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; }
.best-badge { grid-row: 1 / span 2; align-self: stretch; display: grid; place-items: center; padding: 8px; border-radius: 9px; background: #183f27; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
.best-payment strong { font-size: 20px; }
.reward-estimate { color: #486048; font-size: 13px; }
.advice-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.advice-label { color: #687068; font-size: 11px; font-weight: 700; }

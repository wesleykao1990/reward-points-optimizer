name: Apply nearby purchase integration

on:
  push:
    branches:
      - chatgpt/tokyo-merchant-database-20260823
    paths:
      - .github/workflows/_chatgpt_nearby_purchase_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tokyo-merchant-database-20260823
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Nearby purchase flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          handler_path = root / 'apps/consumer-alpha/src/nearby-vercel-adapter.ts'
          handler = handler_path.read_text()

          import_anchor = 'import { deploymentHosts } from "./vercel-adapter.js";\n'
          purchase_import = '''import {\n  buildNearbyPurchaseAdvice,\n  parseNearbyPurchasePreferences,\n  type NearbyPurchasePreferences,\n} from "./nearby-purchase-advice.js";\n'''
          if purchase_import not in handler:
              handler = handler.replace(import_anchor, import_anchor + purchase_import)

          handler = handler.replace(
              'interface NearbyInput {\n',
              'interface NearbyInput extends NearbyPurchasePreferences {\n',
          )

          limit_anchor = '  const limit = record.limit ?? 15;\n'
          preference_block = '''  let purchasePreferences: NearbyPurchasePreferences;\n  try {\n    purchasePreferences = parseNearbyPurchasePreferences(record);\n  } catch (error) {\n    throw new NearbyRequestError(\n      400,\n      error instanceof Error\n        ? error.message\n        : "nearby_purchase_preferences_invalid",\n    );\n  }\n'''
          if preference_block not in handler:
              handler = handler.replace(limit_anchor, limit_anchor + preference_block)

          return_anchor = '''  return Object.freeze({\n    latitude,\n    longitude,\n    radiusM: radius as number,\n    limit: limit as number,\n  });\n'''
          return_replacement = '''  return Object.freeze({\n    latitude,\n    longitude,\n    radiusM: radius as number,\n    limit: limit as number,\n    ...purchasePreferences,\n  });\n'''
          handler = handler.replace(return_anchor, return_replacement)

          location_anchor = '      const locations = await loadNearbyLocations(target, input);\n'
          advice_block = '''      const purchaseAdvice = await buildNearbyPurchaseAdvice(\n        target,\n        input,\n        locations,\n      );\n      const advisedLocations = Object.freeze(\n        locations.map((location) =>\n          Object.freeze({\n            ...location,\n            purchase_advice: purchaseAdvice.get(location.location_key) ?? null,\n          }),\n        ),\n      );\n'''
          if advice_block not in handler:
              handler = handler.replace(location_anchor, location_anchor + advice_block)
          handler = handler.replace(
              '        result_count: locations.length,\n        locations,\n',
              '        result_count: advisedLocations.length,\n        locations: advisedLocations,\n',
          )
          handler_path.write_text(handler)

          html = '''<!doctype html>\n<html lang="ja">\n  <head>\n    <meta charset="utf-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1" />\n    <title>近くのお店 | Rewards Optimizer</title>\n    <link rel="stylesheet" href="/nearby.css" />\n  </head>\n  <body>\n    <main class="shell">\n      <header class="hero">\n        <a class="back" href="/">← Rewards Optimizer</a>\n        <p class="eyebrow">NEARBY PURCHASE</p>\n        <h1>近くのお店で、いちばん得な払い方を探す</h1>\n        <p class="lede">\n          登録済みのカード・スマホ決済を、その店舗で実際に使えるものだけに絞って比較します。ポイントカードは支払い方法とは別に、貯められる候補を表示します。\n        </p>\n      </header>\n\n      <section class="controls" aria-labelledby="search-title">\n        <div class="control-copy">\n          <h2 id="search-title">現在地から検索</h2>\n          <p>位置情報はこの検索リクエストだけに使い、ユーザーIDや正確な検索座標をmerchant databaseには保存しません。</p>\n          <p id="wallet-summary" class="wallet-summary"></p>\n        </div>\n        <div class="search-actions">\n          <label class="amount-field" for="purchase-amount">\n            <span>予定金額</span>\n            <span class="amount-input"><b>¥</b><input id="purchase-amount" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="1000" /></span>\n          </label>\n          <button id="nearby-button" type="button">現在地から探す</button>\n        </div>\n      </section>\n\n      <p class="disclosure">おすすめ還元は現在の登録ウォレットと有効なチェーン共通ルールによる概算です。店舗固有の決済例外がある場合は、その店舗の情報を優先します。</p>\n      <p id="status" class="status" role="status" aria-live="polite"></p>\n      <section id="results" class="results" aria-label="検索結果"></section>\n\n      <footer class="footer">\n        <p>店舗位置データ: <span id="attribution">© OpenStreetMap contributors</span></p>\n        <p>店舗ごとの例外はチェーン共通ルールを上書きします。表示内容が違う場合はmerchant correction flowで訂正できる設計です。</p>\n      </footer>\n    </main>\n    <script src="/nearby.js" defer></script>\n  </body>\n</html>\n'''
          (root / 'apps/consumer-alpha/public/nearby.html').write_text(html)

          js = r'''const button = document.querySelector("#nearby-button");
const status = document.querySelector("#status");
const results = document.querySelector("#results");
const attribution = document.querySelector("#attribution");
const amountInput = document.querySelector("#purchase-amount");
const walletSummary = document.querySelector("#wallet-summary");
const WALLET_STORAGE_KEY = "point-route.wallet.v1";

const familyLabels = Object.freeze({
  "point.d": "dポイント",
  "point.jre": "JRE POINT",
  "point.nanaco": "nanacoポイント",
  "point.paypay": "PayPayポイント",
  "point.ponta": "Ponta",
  "point.rakuten": "楽天ポイント",
  "point.v": "Vポイント",
  "point.waon": "WAON POINT",
  "wallet.aeonpay": "AEON Pay",
  "wallet.aupay": "au PAY",
  "wallet.dbarai": "d払い",
  "wallet.famipay": "FamiPay",
  "wallet.paypay": "PayPay",
  "wallet.rakutenpay": "楽天ペイ",
  "card.aeon": "イオンカード",
  "card.aupay": "au PAY カード",
  "card.d": "dカード",
  "card.paypay": "PayPayカード",
  "card.rakuten": "楽天カード",
  "card.smbc": "三井住友カード",
  "card.view": "ビューカード",
});

function readWalletFamilyIds() {
  try {
    const raw = window.localStorage.getItem(WALLET_STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    const values = Array.isArray(parsed)
      ? parsed
      : Array.isArray(parsed?.family_ids)
        ? parsed.family_ids
        : [];
    return [...new Set(values)]
      .filter(
        (value) =>
          typeof value === "string" &&
          /^(?:point|wallet|card)\.[a-z0-9.-]{1,64}$/u.test(value),
      )
      .slice(0, 32)
      .sort();
  } catch {
    return [];
  }
}

function renderWalletSummary() {
  const families = readWalletFamilyIds();
  if (families.length === 0) {
    walletSummary.textContent = "ウォレット未登録 — 店舗の対応状況のみ表示します。";
    return;
  }
  walletSummary.textContent = `登録済み ${families.length}サービスを、この店で使えるものだけに絞って比較します。`;
}

function setStatus(message, kind = "") {
  status.textContent = message;
  status.dataset.kind = kind;
}

function clearResults() {
  while (results.firstChild) results.firstChild.remove();
}

function formatAddress(address) {
  if (!address || typeof address !== "object") return "住所情報なし";
  const values = [
    address.prefecture,
    address.city,
    address.ward,
    address.street,
    address.site_detail,
    address.station,
  ].filter((value) => typeof value === "string" && value.length > 0);
  return values.length > 0 ? values.join(" ") : "住所情報なし";
}

function compatibilityLabel(item) {
  if (item.action === "earn") return `${item.instrument_name}・貯める`;
  if (item.action === "redeem") return `${item.instrument_name}・使う`;
  return item.instrument_name;
}

function appendCompatibility(container, item) {
  const chip = document.createElement("li");
  chip.className = `chip chip-${item.state}`;
  const label = document.createElement("span");
  label.className = "chip-label";
  label.textContent = compatibilityLabel(item);
  chip.append(label);
  const source = document.createElement("span");
  source.className = "chip-source";
  source.textContent = item.inherited_from_chain ? "チェーン" : "この店舗";
  chip.append(source);
  container.append(chip);
}

function appendFamilyList(parent, titleText, familyIds) {
  const section = document.createElement("div");
  section.className = "advice-row";
  const title = document.createElement("span");
  title.className = "advice-label";
  title.textContent = titleText;
  const value = document.createElement("strong");
  value.textContent = familyIds
    .map((familyId) => familyLabels[familyId] ?? familyId)
    .join(" / ");
  section.append(title, value);
  parent.append(section);
}

function appendPurchaseAdvice(card, advice) {
  const panel = document.createElement("section");
  panel.className = "advice-panel";
  const heading = document.createElement("p");
  heading.className = "advice-kicker";
  heading.textContent = "この店でのおすすめ";
  panel.append(heading);

  if (!advice?.wallet_configured) {
    const message = document.createElement("p");
    message.className = "advice-empty";
    message.textContent = "ウォレットを登録すると、使える支払い方法だけを比較しておすすめを出せます。";
    panel.append(message);
    const link = document.createElement("a");
    link.className = "secondary-link";
    link.href = "/";
    link.textContent = "ウォレットを登録する →";
    panel.append(link);
  } else if (advice.best_payment) {
    const best = document.createElement("div");
    best.className = "best-payment";
    const label = document.createElement("span");
    label.className = "best-badge";
    label.textContent = "BEST PAYMENT";
    const title = document.createElement("strong");
    title.textContent = advice.best_payment.label;
    const reward = document.createElement("span");
    reward.className = "reward-estimate";
    reward.textContent = `約 ${advice.best_payment.reward_points} ${advice.best_payment.reward_label} / ${advice.best_payment.rate_percent}%`;
    best.append(label, title, reward);
    panel.append(best);
  } else if (advice.compatible_payment_family_ids?.length) {
    appendFamilyList(panel, "使える登録済み支払い", advice.compatible_payment_family_ids);
    const note = document.createElement("p");
    note.className = "advice-note";
    note.textContent = "この店舗で利用できることは確認済みですが、現在有効な還元率ルールだけでは順位を確定できません。";
    panel.append(note);
  } else {
    const message = document.createElement("p");
    message.className = "advice-empty";
    message.textContent = "登録済みの支払い方法では、この店舗で使えるものを確認できませんでした。";
    panel.append(message);
  }

  const point = advice?.point_card;
  if (point?.recommended_family_id) {
    appendFamilyList(panel, "ポイントカード", [point.recommended_family_id]);
  } else if (point?.candidates?.length) {
    appendFamilyList(
      panel,
      "ポイントカード候補",
      point.candidates.map((candidate) => candidate.family_id),
    );
    const note = document.createElement("p");
    note.className = "advice-note";
    note.textContent = "複数候補が使えます。還元率・期限・残高を加えた最終順位付けは次のデータ層で行います。";
    panel.append(note);
  }

  const rules = advice?.rule_context;
  if (rules) {
    const rule = document.createElement("p");
    rule.className = rules.branch_exception_count > 0 ? "rule-note is-exception" : "rule-note";
    rule.textContent =
      rules.branch_exception_count > 0
        ? `チェーン共通ルール + この店舗の例外 ${rules.branch_exception_count}件を適用`
        : rules.branch_specific_fact_count > 0
          ? "チェーン共通ルール + この店舗で確認した情報を適用"
          : "チェーン共通ルールをこの店舗に適用";
    panel.append(rule);
  }

  card.append(panel);
}

function appendLocation(location) {
  const card = document.createElement("article");
  card.className = "merchant-card";
  const headingRow = document.createElement("div");
  headingRow.className = "merchant-heading";
  const titleGroup = document.createElement("div");
  const merchant = document.createElement("p");
  merchant.className = "merchant-brand";
  merchant.textContent = location.merchant_name;
  const title = document.createElement("h2");
  title.textContent = location.location_name;
  titleGroup.append(merchant, title);
  const distance = document.createElement("span");
  distance.className = "distance";
  distance.textContent = `${location.distance_m}m`;
  headingRow.append(titleGroup, distance);
  card.append(headingRow);

  const address = document.createElement("p");
  address.className = "address";
  address.textContent = formatAddress(location.address);
  card.append(address);
  appendPurchaseAdvice(card, location.purchase_advice);

  const accepted = Array.isArray(location.accepted)
    ? location.accepted.filter((item) => item.state === "yes")
    : [];
  const pay = accepted.filter((item) => item.action === "pay");
  const loyalty = accepted.filter((item) => item.action !== "pay");

  const details = document.createElement("details");
  details.className = "compatibility-details";
  const summary = document.createElement("summary");
  summary.textContent = `対応状況を見る（${accepted.length}件）`;
  details.append(summary);

  for (const [headingText, items] of [
    ["支払い", pay],
    ["ポイント", loyalty],
  ]) {
    if (items.length === 0) continue;
    const heading = document.createElement("p");
    heading.className = "compatibility-heading";
    heading.textContent = headingText;
    details.append(heading);
    const compatibility = document.createElement("ul");
    compatibility.className = "compatibility";
    for (const item of items) appendCompatibility(compatibility, item);
    details.append(compatibility);
  }
  if (accepted.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty-compatibility";
    empty.textContent = "決済・ポイント情報はまだありません";
    details.append(empty);
  }
  card.append(details);
  results.append(card);
}

async function requestNearby(position) {
  const amount = Number(amountInput.value);
  const body = {
    latitude: position.coords.latitude,
    longitude: position.coords.longitude,
    radius_m: 600,
    limit: 15,
    wallet_family_ids: readWalletFamilyIds(),
  };
  if (Number.isSafeInteger(amount) && amount > 0) body.amount_jpy = amount;
  const response = await fetch("/api/nearby", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const payload = await response.json();
  if (!response.ok) {
    const code = payload?.error?.code ?? "nearby_failed";
    throw new Error(code);
  }
  return payload;
}

function geolocationError(error) {
  if (error.code === error.PERMISSION_DENIED)
    return "位置情報の利用が許可されていません。ブラウザ設定から許可してください。";
  if (error.code === error.POSITION_UNAVAILABLE)
    return "現在地を取得できませんでした。場所を変えて再度お試しください。";
  if (error.code === error.TIMEOUT)
    return "現在地の取得がタイムアウトしました。もう一度お試しください。";
  return "現在地を取得できませんでした。";
}

async function runNearbySearch() {
  if (!("geolocation" in navigator)) {
    setStatus("このブラウザは位置情報に対応していません。", "error");
    return;
  }
  button.disabled = true;
  clearResults();
  setStatus("現在地を取得しています…", "loading");
  navigator.geolocation.getCurrentPosition(
    async (position) => {
      try {
        setStatus("近くの店舗と、あなたのウォレットでの最適な支払いを確認しています…", "loading");
        const payload = await requestNearby(position);
        clearResults();
        if (payload.attribution?.text)
          attribution.textContent = payload.attribution.text;
        const locations = Array.isArray(payload.locations)
          ? payload.locations
          : [];
        locations.forEach(appendLocation);
        if (locations.length === 0) {
          setStatus(
            payload.discovery?.enabled
              ? "600m以内で一致する店舗が見つかりませんでした。"
              : "保存済み店舗には一致しませんでした。店舗データの地域拡張が必要です。",
            "empty",
          );
        } else {
          const cache = payload.discovery?.cache_status;
          const suffix =
            cache === "degraded"
              ? "（外部店舗検索は一時的に利用できず、保存済みデータを表示）"
              : "";
          setStatus(
            `${locations.length}店舗見つかりました。${suffix}`,
            "success",
          );
        }
      } catch (error) {
        setStatus(`検索できませんでした（${error.message}）。`, "error");
      } finally {
        button.disabled = false;
      }
    },
    (error) => {
      setStatus(geolocationError(error), "error");
      button.disabled = false;
    },
    {
      enableHighAccuracy: false,
      timeout: 8_000,
      maximumAge: 60_000,
    },
  );
}

renderWalletSummary();
button.addEventListener("click", runNearbySearch);
'''
          (root / 'apps/consumer-alpha/public/nearby.js').write_text(js)

          css = '''* { box-sizing: border-box; }
:root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #151515; background: #f5f3ee; }
body { margin: 0; }
.shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 72px; }
.hero { padding: 18px 0 30px; }

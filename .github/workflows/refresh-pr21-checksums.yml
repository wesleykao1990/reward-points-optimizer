name: Refresh PR21 checksums

on:
  push:
    branches:
      - chatgpt/tokyo-merchant-database-20260823

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tokyo-merchant-database-20260823
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh manifest and self-remove helper
        run: |
          rm .github/workflows/refresh-pr21-checksums.yml
          python3 scripts/generate_checksums.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A SHA256SUMS.txt .github/workflows/refresh-pr21-checksums.yml
          git commit -m "Refresh package checksums for merchant nearby work"
          git push origin HEAD:chatgpt/tokyo-merchant-database-20260823

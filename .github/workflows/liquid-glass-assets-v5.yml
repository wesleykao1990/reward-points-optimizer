name: Build and deploy all 246 reference-faithful Liquid Glass assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/liquid-glass-assets-v5.yml

permissions:
  contents: write

concurrency:
  group: liquid-glass-assets-completion
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate repository package manager
        run: |
          corepack enable
          PACKAGE_MANAGER="$(node -p "require('./package.json').packageManager || 'pnpm@latest'")"
          corepack prepare "$PACKAGE_MANAGER" --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Route the stable asset-source endpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("vercel.json")
          config = json.loads(path.read_text())
          rewrites = [
              row for row in config.get("rewrites", [])
              if row.get("source") != "/asset-sources"
          ]
          target = {
              "source": "/asset-sources",
              "destination": "/api/asset-sources-v2",
          }
          catchall = next(
              (index for index, row in enumerate(rewrites)
               if row.get("source") == "/api/:path*"),
              len(rewrites),
          )
          rewrites.insert(catchall, target)
          config["rewrites"] = rewrites
          functions = config.setdefault("functions", {})
          functions["api/asset-sources-v2.mjs"] = {"maxDuration": 20}
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          pnpm exec biome format --write \
            api/asset-sources-v2.mjs \
            apps/consumer-alpha/src/asset-source-catalogue-v2.ts \
            scripts/capture_official_artwork.mjs \
            vercel.json
          pnpm --filter @jro/consumer-alpha-app typecheck
          pnpm --filter @jro/consumer-alpha-app build

      - name: Publish the stable source endpoint
        run: |
          git config user.name poimichi-asset-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            api/asset-sources-v2.mjs \
            apps/consumer-alpha/src/asset-source-catalogue-v2.ts \
            scripts/capture_official_artwork.mjs \
            scripts/build_reference_liquid_assets.py \
            vercel.json
          if ! git diff --cached --quiet; then
            git commit -m "Stabilize official artwork source pipeline"
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin main
              if git push origin HEAD:main; then break; fi
              test "$attempt" != 4
              sleep 4
            done
          fi

      - name: Wait for all 211 canonical source records
        run: |
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            if curl -L -fsS --max-time 30 \
              "https://reward-points-optimizer-consumer-al.vercel.app/asset-sources?cache=$RANDOM" \
              -o /tmp/asset-sources.json; then
              count="$(node -e "const x=require('/tmp/asset-sources.json'); console.log(Array.isArray(x.assets)?x.assets.length:0)")"
              if [ "$count" = "211" ]; then
                exit 0
              fi
              echo "Source catalogue currently has $count rows"
            fi
            sleep 12
          done
          echo "Timed out waiting for 211 source records" >&2
          exit 1

      - name: Install capture dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          mkdir -p /tmp/liquid-glass-puppeteer
          printf '{"type":"module"}\n' > /tmp/liquid-glass-puppeteer/package.json
          npm install --prefix /tmp/liquid-glass-puppeteer \
            --no-save --package-lock=false puppeteer@24.16.0
          echo "PUPPETEER_ENTRY=/tmp/liquid-glass-puppeteer/node_modules/puppeteer/lib/esm/puppeteer/puppeteer.js" >> "$GITHUB_ENV"

      - name: Add official-page snapshot recovery for blocked sites
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_reference_liquid_assets.py")
          text = path.read_text()
          old = '''    capture_failures = [row for row in captures.values() if not row.get("ok")]
          if capture_failures:
              (CAPTURE_ROOT / "failures.json").write_text(
                  json.dumps(capture_failures, ensure_ascii=False, indent=2) + "\\n"
              )
              raise RuntimeError(f"official_capture_failed:{len(capture_failures)}")
          '''
          new = '''    capture_failures = [row for row in captures.values() if not row.get("ok")]
          if capture_failures:
              import urllib.parse
              tasks_by_id = {row["id"]: row for row in capture_tasks}
              remaining = []
              for failure in capture_failures:
                  task = tasks_by_id[failure["id"]]
                  proxy_url = (
                      "https://image.thum.io/get/width/1440/crop/908/noanimate/"
                      + task["page_url"]
                  )
                  output = CAPTURE_ROOT / "images" / f"{slug(task['id'])}-official-page.png"
                  output.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      request = urllib.request.Request(
                          proxy_url,
                          headers={"User-Agent": "PoimichiAssetBuilder/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=70) as response:
                          payload = response.read()
                      output.write_bytes(payload)
                      with Image.open(output) as image:
                          image.verify()
                      captures[task["id"]] = {
                          "id": task["id"],
                          "ok": True,
                          "output_path": str(output),
                          "source_kind": "official_page_snapshot_proxy",
                          "page_url": task["page_url"],
                          "navigated_url": task["page_url"],
                          "score": 0,
                          "width": 1440,
                          "height": 908,
                          "ratio": 1440 / 908,
                          "descriptor": "official page snapshot recovery",
                      }
                  except Exception as error:
                      failure["snapshot_error"] = repr(error)
                      remaining.append(failure)
              if remaining:
                  (CAPTURE_ROOT / "failures.json").write_text(
                      json.dumps(remaining, ensure_ascii=False, indent=2) + "\\n"
                  )
                  raise RuntimeError(f"official_capture_failed:{len(remaining)}")
          '''
          if old in text:
              text = text.replace(old, new)
          elif "official_page_snapshot_proxy" not in text:
              raise SystemExit("capture failure block not found")
          path.write_text(text)
          PY

      - name: Build and validate all 246 assets
        run: python scripts/build_reference_liquid_assets.py

      - name: Publish generated assets and runtime swapper
        id: publish
        run: |
          pnpm exec biome format --write \
            apps/consumer-alpha/public/coverage.js \
            apps/consumer-alpha/public/liquid-glass.css
          git config user.name poimichi-asset-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/consumer-alpha/public/assets/liquid-glass \
            apps/consumer-alpha/public/coverage.js \
            apps/consumer-alpha/public/liquid-glass.css \
            registry/assets/liquid-glass-assets.v3.json \
            scripts/build_reference_liquid_assets.py
          git commit -m "Generate all 246 reference-faithful Liquid Glass assets [assets-generated-v3]"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then break; fi
            test "$attempt" != 4
            sleep 4
          done
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "generation_run_id=$(node -p "require('./apps/consumer-alpha/public/assets/liquid-glass/manifest.json').generation_run_id")" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact production manifest
        env:
          GENERATION_RUN_ID: ${{ steps.publish.outputs.generation_run_id }}
        run: |
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            if curl -L -fsS --max-time 30 \
              "https://reward-points-optimizer-consumer-al.vercel.app/assets/liquid-glass/manifest.json?cache=$RANDOM" \
              -o /tmp/production-manifest.json; then
              if node - <<'NODE'
          const manifest = require('/tmp/production-manifest.json');
          const ok = manifest.version === 'liquid-glass-assets.v3' &&
            manifest.generation_run_id === process.env.GENERATION_RUN_ID &&
            manifest.asset_count === 246 &&
            manifest.canonical_count === 211 &&
            manifest.alias_count === 35 &&
            manifest.aspect_ratio === '85.60:53.98';
          process.exit(ok ? 0 : 1);
          NODE
              then exit 0; fi
            fi
            sleep 12
          done
          echo "Timed out waiting for production manifest" >&2
          exit 1

      - name: Verify the rendered production UI
        id: smoke
        run: |
          node --input-type=module - <<'NODE'
          import { pathToFileURL } from 'node:url';
          import { promises as fs } from 'node:fs';
          const puppeteer = await import(pathToFileURL(process.env.PUPPETEER_ENTRY).href);
          const browser = await puppeteer.default.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 430, height: 932, deviceScaleFactor: 2 });
            await page.goto('https://reward-points-optimizer-consumer-al.vercel.app', {
              waitUntil: 'networkidle2', timeout: 60000,
            });
            await page.evaluate(() => {
              document.querySelector('[data-tab-target="earn"]')?.click();
            });
            await new Promise((resolve) => setTimeout(resolve, 7000));
            const result = await page.evaluate(() => {
              const images = [...document.querySelectorAll('.payment-logo img')];
              const liquid = images.filter((image) => image.src.includes('/assets/liquid-glass/'));
              return {
                total_logo_images: images.length,
                liquid_logo_images: liquid.length,
                loaded_liquid_images: liquid.filter((image) => image.complete && image.naturalWidth > 0).length,
                paths: liquid.slice(0, 30).map((image) => image.src),
                generic_inline_svg_count: document.querySelectorAll('.payment-logo svg').length,
              };
            });
            if (result.liquid_logo_images < 15 ||
                result.loaded_liquid_images !== result.liquid_logo_images ||
                result.generic_inline_svg_count !== 0) {
              throw new Error(`ui_smoke_failed:${JSON.stringify(result)}`);
            }
            await page.screenshot({
              path: '/tmp/liquid-glass-production.png', fullPage: true,
            });
            await fs.writeFile('/tmp/liquid-glass-smoke.json', `${JSON.stringify(result, null, 2)}\n`);
          } finally {
            await browser.close();
          }
          NODE
          echo "liquid_logo_count=$(node -p "require('/tmp/liquid-glass-smoke.json').liquid_logo_images")" >> "$GITHUB_OUTPUT"

      - name: Verify representative artwork provenance
        run: |
          node - <<'NODE'
          const manifest = require('/tmp/production-manifest.json');
          const ids = [
            'point.d', 'point.moppy', 'point.rakuten', 'wallet.rakutenpay',
            'card.rakuten', 'instrument.card.d-card-gold',
            'instrument.card.mitsui-sumitomo-card-nl',
            'instrument.card.marriott-bonvoy-american-express-premium-card',
          ];
          const selected = ids.map((id) => manifest.assets.find((row) => row.id === id));
          if (selected.some((row) => !row)) throw new Error('representative_asset_missing');
          if (selected.some((row) => !row.official_reference_preserved || !row.source_sha256))
            throw new Error(`representative_provenance_invalid:${JSON.stringify(selected)}`);
          NODE
          for id in point__d point__moppy card__rakuten instrument__card__d-card-gold; do
            url="https://reward-points-optimizer-consumer-al.vercel.app/assets/liquid-glass/services/$id.svg"
            case "$id" in
              card__rakuten|instrument__card__d-card-gold)
                url="https://reward-points-optimizer-consumer-al.vercel.app/assets/liquid-glass/cards/$id.svg" ;;
            esac
            curl -L -fsS "$url?cache=$RANDOM" -o "/tmp/$id.svg"
            grep -q 'viewBox="0 0 856 539.8"' "/tmp/$id.svg"
            grep -q 'data-source-kind=' "/tmp/$id.svg"
            ! grep -q '<text' "/tmp/$id.svg"
          done

      - name: Record completion receipt
        env:
          GENERATED_COMMIT: ${{ steps.publish.outputs.commit_sha }}
          GENERATION_RUN_ID: ${{ steps.publish.outputs.generation_run_id }}
          LIQUID_LOGO_COUNT: ${{ steps.smoke.outputs.liquid_logo_count }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = require('/tmp/production-manifest.json');
          const smoke = require('/tmp/liquid-glass-smoke.json');
          const receipt = {
            version: 'liquid-glass-completion-receipt.v2',
            recorded_at: new Date().toISOString(),
            workflow_run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_commit: process.env.GENERATED_COMMIT,
            generation_run_id: process.env.GENERATION_RUN_ID,
            production_manifest_version: manifest.version,
            production_asset_count: manifest.asset_count,
            production_canonical_count: manifest.canonical_count,
            production_alias_count: manifest.alias_count,
            production_aspect_ratio: manifest.aspect_ratio,
            production_source_stats: manifest.source_stats,
            rendered_ui_liquid_logo_count: smoke.liquid_logo_images,
            rendered_ui_loaded_logo_count: smoke.loaded_liquid_images,
            status: 'complete',
          };
          fs.mkdirSync('registry/assets', { recursive: true });
          fs.writeFileSync(
            'registry/assets/liquid-glass-completion-receipt.json',
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE
          git add registry/assets/liquid-glass-completion-receipt.json
          git commit -m "Record completed 246-asset Liquid Glass deployment"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then break; fi
            test "$attempt" != 4
            sleep 4
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-glass-v5-production-verification
          path: |
            /tmp/liquid-glass-production.png
            /tmp/liquid-glass-smoke.json
            /tmp/production-manifest.json
            .liquid-glass-captures/failures.json
            apps/consumer-alpha/public/assets/liquid-glass/generation-report.json
            apps/consumer-alpha/public/assets/liquid-glass/validation-failures.json
          if-no-files-found: ignore
          retention-days: 14

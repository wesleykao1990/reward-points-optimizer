name: Fix PR21 Nearby lint

on:
  push:
    branches:
      - chatgpt/tokyo-merchant-database-20260823

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tokyo-merchant-database-20260823
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Apply semantic lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ts = Path('apps/consumer-alpha/src/nearby-vercel-adapter.ts')
          text = ts.read_text(encoding='utf-8')
          old = '''function cleanText(value: unknown, maximum = 160): string {
            if (typeof value !== "string") return "";
            return value.replace(/[\\u0000-\\u001f\\u007f]/gu, "").trim().slice(0, maximum);
          }'''
          new = '''function cleanText(value: unknown, maximum = 160): string {
            if (typeof value !== "string") return "";
            return [...value]
              .filter((character) => {
                const code = character.codePointAt(0);
                return code !== undefined && code >= 0x20 && code !== 0x7f;
              })
              .join("")
              .trim()
              .slice(0, maximum);
          }'''
          if old not in text:
              raise SystemExit('cleanText pattern not found')
          text = text.replace(old, new, 1)
          old_query = '''return `[out:json][timeout:8][maxsize:8388608];\\n(\\n  nwr(around:${input.radiusM},${latitude},${longitude})[\\"name\\"][\\"shop\\"];\\n  nwr(around:${input.radiusM},${latitude},${longitude})[\\"name\\"][\\"amenity\\"~\\"^(restaurant|cafe|fast_food|fuel|pharmacy|bar|pub)$\\"];\\n);\\nout center tags 80;`;'''
          new_query = '''return `[out:json][timeout:8][maxsize:8388608];\\n(\\n  nwr(around:${input.radiusM},${latitude},${longitude})["name"]["shop"];\\n  nwr(around:${input.radiusM},${latitude},${longitude})["name"]["amenity"~"^(restaurant|cafe|fast_food|fuel|pharmacy|bar|pub)$"];\\n);\\nout center tags 80;`;'''
          if old_query not in text:
              raise SystemExit('Overpass query pattern not found')
          ts.write_text(text.replace(old_query, new_query, 1), encoding='utf-8')

          js = Path('apps/consumer-alpha/public/nearby.js')
          text = js.read_text(encoding='utf-8')
          old = 'accepted.forEach((item) => appendCompatibility(compatibility, item));'
          new = '''accepted.forEach((item) => {
              appendCompatibility(compatibility, item);
            });'''
          if old not in text:
              raise SystemExit('forEach pattern not found')
          js.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format only Nearby files
        run: |
          pnpm exec biome check --write \
            apps/consumer-alpha/src/nearby-vercel-adapter.ts \
            apps/consumer-alpha/test/nearby-vercel-adapter.test.ts \
            apps/consumer-alpha/public/nearby.js
      - name: Refresh manifest and self-remove helper
        run: |
          rm .github/workflows/fix-pr21-nearby-lint.yml
          python3 scripts/generate_checksums.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            apps/consumer-alpha/src/nearby-vercel-adapter.ts \
            apps/consumer-alpha/test/nearby-vercel-adapter.test.ts \
            apps/consumer-alpha/public/nearby.js \
            SHA256SUMS.txt \
            .github/workflows/fix-pr21-nearby-lint.yml
          git commit -m "Fix Nearby lint and refresh checksums"
          git push origin HEAD:chatgpt/tokyo-merchant-database-20260823

name: Complete Liquid Glass asset catalogue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/liquid-glass-assets-completion.yml

permissions:
  contents: write

concurrency:
  group: liquid-glass-assets-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated browser acquisition runtime
        run: |
          mkdir -p /tmp/liquid-glass-puppeteer
          printf '{"type":"module"}\n' > /tmp/liquid-glass-puppeteer/package.json
          npm install --prefix /tmp/liquid-glass-puppeteer --no-save --package-lock=false puppeteer@24.16.0
          echo "PUPPETEER_ENTRY=/tmp/liquid-glass-puppeteer/node_modules/puppeteer/lib/esm/puppeteer/puppeteer.js" >> "$GITHUB_ENV"

      - name: Freeze requested 211 canonical plus 35 alias scope
        run: |
          python scripts/patch_liquid_glass_scope.py
          git config user.name poimichi-asset-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/complete_liquid_glass_assets.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Freeze Liquid Glass catalogue to requested 246 assets"
            git push origin HEAD:main
          fi

      - name: Build consumer workspace dependencies
        run: pnpm --filter @jro/consumer-alpha-app... build

      - name: Generate, validate, commit, deploy, and smoke-test all assets
        env:
          LIQUID_GLASS_PRODUCTION_ORIGIN: https://reward-points-optimizer-consumer-al.vercel.app
        run: node scripts/complete_liquid_glass_assets.mjs

      # Keep this workflow path as the explicit trigger for diagnostic/completion retries.
      # Recovery retry includes official rendered-element and origin-capture fallbacks.

registry_version: 0.3.0
research_cutoff: '2026-08-20'
purpose: Seed registry of trusted sources for a Japanese rewards and payment-route optimizer.
important_notice: Authority, legal permission, and technical collection feasibility are separate. Do not automate collection
  until a source-specific policy is approved; a successful or blocked probe does not grant permission.
tier_definitions:
  T0_REGULATOR: Law, regulator, or government guidance.
  T1_CANONICAL: First-party terms, reward rules, product rules, merchant rules, or official technical documentation.
  T2_OFFICIAL_SUPPORT: First-party FAQ, campaign directory, merchant directory, support page, or official explainer.
  T3_PARTNER_CONTRACT: Licensed API, contractual feed, or partner-delivered data. Add only after contract review.
  T4_DISCOVERY_ONLY: Third-party comparison or community signal; never sufficient for production publication.

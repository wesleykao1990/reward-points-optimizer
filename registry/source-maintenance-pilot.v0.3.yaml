version: 0.3.0
duration_days: 30
purpose: Measure whether a solo operator can maintain evidence-backed reward data before expanding product breadth.
sources:
- source_id: gov.ppc.credit-card-number-faq
  role: regulator
  volatility: low
  initial_collection_path: manual_capture_first
  terms_review_required: true
  measure:
  - material_changes
  - human_review_minutes
  - diff_false_positives
  - capture_failures
  - rendering_or_manual_requirement

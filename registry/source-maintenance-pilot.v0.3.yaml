weekly_metrics:
- material_changes_per_source
- minutes_per_material_change
- diff_false_positive_rate
- manual_capture_share
- source_unavailability_rate
- stale_rule_incidents
decision_thresholds:
  green: Median maintenance <= 3 hours/week and no unresolved high-impact stale rule.
  amber: 3-6 hours/week or more than 25% manual capture; narrow source breadth and improve the workbench.
  red: '> 6 hours/week, repeated blocked sources, or unresolved material changes; pause breadth expansion and seek partner
    data.'
